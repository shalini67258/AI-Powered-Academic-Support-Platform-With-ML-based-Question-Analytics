# ===============================
# Server
# ===============================
server.port=8080
spring.application.name=insight-hub

# ===============================
# H2 Database Configuration
# ===============================
spring.datasource.url=jdbc:h2:file:./data/insightdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=shalini
spring.datasource.password=shalini

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=160MB
spring.servlet.multipart.max-request-size=160MB
server.tomcat.max-swallow-size=200MB
server.tomcat.connection-timeout=60000